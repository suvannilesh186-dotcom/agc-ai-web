<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agc.app - Nilesh Status king</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Corner Profile Logo Container -->
  <div id="top-profile-container" style="position: fixed; top: 15px; right: 15px; z-index: 1000; display: none; cursor: pointer;">
    <img id="top-profile-logo" src="" alt="Profile Logo" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff; object-fit: cover;" />
  </div>

  <!-- Video Animation Section -->
  <div class="video-container">
    <video autoplay loop muted playsinline class="responsive-video">
      <source src="assets/animation.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- New Header Title (AGC.AI Welcome) -->
  <div class="header-title">
    <h1>AGC.AI<br><span>Welcome</span></h1>
  </div>

  <!-- Auth Section -->
  <div id="auth-section" class="auth-container">
    <button id="google-login-btn" class="auth-btn">
      Sign in with Gmail & Connect YouTube
    </button>
  </div>

  <!-- Channel Profile Details Box (Initially hidden) -->
  <div id="channel-profile" class="channel-profile" style="display: none; position: fixed; top: 70px; right: 15px; background: #222; color: #fff; padding: 15px; border-radius: 8px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
    <h3 id="channel-name" style="margin: 0 0 5px 0; font-size: 16px;"></h3>
    <p id="channel-email" style="margin: 0; font-size: 14px; color: #aaa;"></p>
  </div>

  <!-- JavaScript logic -->
  <script src="JavaScript.js" type="module"></script>
</body>
</html>
