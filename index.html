<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGC.AI - Nilesh Status King</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top-Left Hamburger Menu Button -->
  <div id="top-profile-container">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </div>

  <!-- Video Background Animation -->
  <div class="video-container">
    <video autoplay loop muted playsinline class="responsive-video">
      <source src="assets/animation.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- Auth Section (Login) -->
  <div id="auth-section" class="auth-container">
    <div class="welcome-box">
      <h1>AGC.AI</h1>
      <p>Nilesh Status King AI Assistant</p>
      <button id="google-login-btn" class="auth-btn">
        Sign in with Gmail & Connect YouTube
      </button>
    </div>
  </div>

  <!-- Main AI Chat Interface (ChatGPT / Gemini Style) -->
  <div id="main-ai-dashboard" class="chat-app-container" style="display: none;">
    
    <!-- Chat Header -->
    <div class="chat-app-header">
      <div class="ai-status-dot"></div>
      <span>AGC.AI Assistant (हिंदी Voice)</span>
    </div>

    <!-- Messages Area -->
    <div id="chat-messages" class="chat-messages-area">
      <div class="bot-msg">
        नमस्ते Nilesh! मैं आपका पर्सनल AI हूँ। आप मुझसे कुछ भी पूछ सकते हैं या तस्वीर बनाने के लिए कह सकते हैं। बोलिए, आज क्या मदद करूँ?
      </div>
    </div>

    <!-- Input Bar at Bottom -->
    <div class="chat-input-bar">
      <input type="text" id="chat-input" placeholder="यहाँ कुछ लिखें या इमेज के लिए कहें..." autocomplete="off" />
      <button id="send-chat-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>

  </div>

  <!-- Left-Side Sidebar (Profile & Logout) -->
  <div id="channel-profile" class="channel-profile">
    <div class="profile-header">
      <img id="popup-profile-img" src="" alt="Logo" />
      <div class="profile-info">
        <h3 id="channel-name"></h3>
        <p id="channel-email"></p>
      </div>
    </div>
    <button id="logout-btn">Logout</button>
  </div>

  <!-- JavaScript logic -->
  <script src="JavaScript.js" type="module"></script>
</body>
</html>
