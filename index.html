<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agc.app - Nilesh Status king</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Corner Hamburger Menu Button -->
  <div id="top-profile-container">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </div>

  <!-- Video Animation Section -->
  <div class="video-container">
    <video autoplay loop muted playsinline class="responsive-video">
      <source src="assets/animation.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- New Header Title (AGC.AI Welcome) -->
  <div class="header-title">
    <h1>AGC.AI<br><span>Welcome</span></h1>
  </div>

  <!-- Auth Section -->
  <div id="auth-section" class="auth-container">
    <button id="google-login-btn" class="auth-btn">
      Sign in with Gmail & Connect YouTube
    </button>
  </div>

  <!-- Left-Side Full Height Sidebar -->
  <div id="channel-profile" class="channel-profile">
    <div class="profile-header">
      <img id="popup-profile-img" src="" alt="Logo" />
      <div class="profile-info">
        <h3 id="channel-name"></h3>
        <p id="channel-email"></p>
      </div>
    </div>
    <button id="logout-btn">Logout</button>
  </div>

  <!-- JavaScript logic -->
  <script src="JavaScript.js" type="module"></script>
</body>
</html>
